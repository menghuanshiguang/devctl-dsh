<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;display:flex;height:100vh;font:15px/1.6 sans-serif}
nav{width:220px;background:#f4f4f6;padding:12px;flex:none}
nav div{padding:8px;border-radius:8px;cursor:pointer}
nav div.on{background:#dfe6ff}
main{flex:1;padding:20px}
</style></head><body>
<nav id="nav">
  <div data-s="general">通用设置</div>
  <div data-s="models">模型</div>
  <div data-s="devctl">devctl</div>
  <div data-s="rules">规则设定</div>
</nav>
<main id="main"><h1 id="t">通用设置</h1><p id="b">这里应当是「通用设置」的内容</p></main>
<script>
var nav=document.getElementById('nav');
nav.addEventListener('click',function(e){
  var d=e.target.closest('div[data-s]'); if(!d)return;
  [].forEach.call(nav.children,function(x){x.className=''});
  d.className='on';
  var id=d.getAttribute('data-s');
  document.getElementById('t').textContent=d.textContent;
  document.getElementById('b').textContent='这里应当是「'+d.textContent+'」的内容';
});
</script></body></html>

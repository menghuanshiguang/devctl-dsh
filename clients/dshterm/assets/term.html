<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DSH 终端</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --line:#242a31; --fg:#d7dde5; --dim:#8b95a1;
    --accent:#4c9aff; --ok:#3ddc84; --err:#ff6b6b; --warn:#ffb454;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  #dot.run{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #dot.busy{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  #title{font-weight:600;letter-spacing:.3px}
  #cwd{margin-left:auto;color:var(--dim);font-size:11px;max-width:45%;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  #quick{display:flex;gap:6px;padding:8px 10px 0;flex-wrap:wrap;flex:0 0 auto}
  #quick button{background:#1b2027;border:1px solid var(--line);color:var(--fg);
    border-radius:999px;padding:5px 11px;font-size:12px;font-family:inherit}
  #quick button:active{background:#232a33}
  #term{flex:1 1 auto;overflow-y:auto;padding:10px 12px 16px;
    -webkit-overflow-scrolling:touch;word-break:break-all;white-space:pre-wrap}
  .ln{white-space:pre-wrap;word-break:break-all}
  .err{color:var(--err)} .ok{color:var(--ok)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  #bar{display:flex;gap:8px;padding:9px 10px;background:var(--panel);
    border-top:1px solid var(--line);flex:0 0 auto;align-items:center}
  #cmd{flex:1;background:#0f1216;border:1px solid var(--line);border-radius:10px;
    color:var(--fg);padding:9px 11px;font:inherit;outline:none}
  #send,#stop{background:var(--accent);color:#06121f;border:0;border-radius:10px;
    padding:9px 13px;font:inherit;font-weight:600}
  #stop{background:#2a2f37;color:var(--fg)}
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="dot"></span>
    <span id="title">DSH 终端</span>
    <span id="cwd">准备中…</span>
  </header>

  <div id="quick">
    <button onclick="term.act('install')">装环境</button>
    <button onclick="term.act('harness')">装 harness</button>
    <button onclick="term.act('start')">启动 dsh web</button>
    <button onclick="term.act('stop')">停止</button>
    <button onclick="term.act('clear')">清屏</button>
    <button onclick="term.run('node -v; npm -v')">node/npm</button>
    <button onclick="term.run('dsh --version')">dsh 版本</button>
    <button onclick="term.run('uname -a; cat /etc/os-release | head -2')">系统</button>
    <button onclick="term.run('df -h / | tail -2')">磁盘</button>
  </div>

  <div id="term"></div>

  <div id="bar">
    <input id="cmd" placeholder="在 Ubuntu 里执行命令…" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="send" onclick="term.submit()">运行</button>
    <button id="stop" onclick="term.act('stop')">停</button>
  </div>
</div>

<script>
// ── 终端核心：跟真终端一样处理 \r（同行刷新）、\n（换行）和基本 ANSI 颜色 ──
var term = (function () {
  var out = document.getElementById('term');
  var MAX = 1500;          // 回滚上限：太多条会把手机拖死
  var lines = [];          // 已定稿的行（html 片段）
  var cur = '';            // 当前未定稿的行
  var curCls = '';
  var pending = false;

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render() {
    pending = false;
    var html = lines.join('');
    if (cur.length > 0) html += '<div class="ln ' + curCls + '">' + esc(cur) + '</div>';
    out.innerHTML = html + '<div style="height:2px"></div>';
    out.scrollTop = out.scrollHeight;
  }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(render);
  }

  function commit() {
    lines.push('<div class="ln ' + curCls + '">' + esc(cur) + '</div>');
    if (lines.length > MAX) lines.splice(0, lines.length - MAX);
    cur = '';
  }

  // 极简 ANSI：只认 SGR 颜色，其它转义（清行、光标移动）直接吃掉
  function applySgr(params) {
    var parts = params.split(';');
    for (var i = 0; i < parts.length; i++) {
      var n = parseInt(parts[i] || '0', 10);
      if (n === 0 || n === 39) curCls = '';
      else if (n === 31 || n === 91) curCls = 'err';
      else if (n === 32 || n === 92) curCls = 'ok';
      else if (n === 33 || n === 93) curCls = 'warn';
      else if (n === 90) curCls = 'dim';
      else if (n === 36 || n === 96 || n === 34) curCls = '';
    }
  }

  function chunk(text) {
    if (!text) return;
    var i = 0;
    while (i < text.length) {
      var c = text[i];
      if (c === '\r') { cur = ''; i++; continue; }                     // 回车：本行重写
      if (c === '\n') { commit(); i++; continue; }
      if (c === '\u001b') {                                            // ESC
        var m = /^\u001b\[([0-9;]*)([A-Za-z])/.exec(text.slice(i));
        if (m) {
          if (m[2] === 'm') applySgr(m[1]);
          i += m[0].length;                                            // 其它（[K/光标等）忽略
          continue;
        }
        i++; continue;
      }
      cur += c;
      i++;
    }
    schedule();
  }

  function write(line) { chunk(line + '\n'); }

  return {
    chunk: chunk,
    write: write,
    clear: function () { lines = []; cur = ''; render(); },
    setState: function (state, cwd) {
      var d = document.getElementById('dot');
      d.className = state === 'run' ? 'run' : (state === 'busy' ? 'busy' : '');
      if (cwd) document.getElementById('cwd').textContent = cwd;
    },
    submit: function () {
      var el = document.getElementById('cmd');
      var v = el.value.trim();
      if (!v) return;
      el.value = '';
      chunk('$ ' + v + '\n');
      if (window.dsh) dsh.run(v);
    },
    run: function (cmd) {
      chunk('$ ' + cmd + '\n');
      if (window.dsh) dsh.run(cmd);
    },
    act: function (what) {
      if (!window.dsh) return;
      if (what === 'clear') { term.clear(); return; }
      if (what === 'stop') { dsh.stop(); return; }
      if (what === 'install') dsh.install();
      if (what === 'harness') dsh.installHarness();
      if (what === 'start') dsh.startHarness();
    }
  };
})();
window.term = term;
document.addEventListener('DOMContentLoaded', function () {
  if (window.dsh) { try { dsh.ready(); } catch (e) {} }
});
window.onload = function () { if (window.dsh) { try { dsh.ready(); } catch (e) {} } };
</script>
</body>
</html>

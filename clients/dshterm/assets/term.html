<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DSH 终端</title>
<style>
  :root{
    --bg:#0B0B0D; --panel:#15151A; --line:#26262E; --fg:#E6E6EA; --dim:#9A9AA5; --mut:#6A6A75;
    --accent:#4C9AFF; --ok:#3DD68C; --warn:#FFB020; --err:#FF5A52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
  header .dot.on{background:var(--ok)}
  header .dot.busy{background:var(--warn)}
  header h1{font-size:15px;font-weight:600;margin:0}
  header .path{flex:1;font:11px ui-monospace,Menlo,monospace;color:var(--mut);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #out{flex:1;overflow-y:auto;padding:12px 14px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word}
  #out .e{color:var(--err)} #out .ok{color:var(--ok)} #out .d{color:var(--mut)} #out .i{color:var(--accent)}
  .bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
  button{flex:0 0 auto;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
    background:#1D1D23;color:var(--fg);font-size:13px}
  button:active{background:#26262E}
  button.p{background:var(--accent);border-color:var(--accent);color:#08131F;font-weight:600}
  button.danger{border-color:#43252A;color:var(--err)}
  .input{display:flex;gap:8px;padding:8px 12px 12px;background:var(--panel)}
  .input input{flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0F0F13;color:var(--fg);font:13px ui-monospace,Menlo,monospace;outline:none}
  .input input:focus{border-color:var(--accent)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;background:var(--panel)}
  .chips span{flex:0 0 auto;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
    color:var(--dim);font:12px ui-monospace,Menlo,monospace}
  .chips span:active{background:#26262E}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>DSH 终端</h1>
  <div class="path" id="path"></div>
</header>

<div id="out"></div>

<div class="bar">
  <button class="p" id="bInstall">装环境</button>
  <button id="bHarness">装 harness</button>
  <button id="bStop" class="danger">停止</button>
  <button id="bClear">清屏</button>
</div>

<div class="chips">
  <span data-cmd="node -v && npm -v">node -v</span>
  <span data-cmd="cd /opt/dsh && node node_modules/@deepseek-ai/dsh/lib/bin.js --version">dsh --version</span>
  <span data-cmd="cd /opt/dsh && node node_modules/@deepseek-ai/dsh/lib/bin.js web">启动 dsh web</span>
  <span data-cmd="uname -a; cat /etc/os-release | head -2">系统信息</span>
  <span data-cmd="df -h / | tail -1">磁盘</span>
</div>

<div class="input">
  <input id="cmd" placeholder="在 Ubuntu 里跑一条命令（如 ls /opt）" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="p" id="bRun">运行</button>
</div>

<script>
const out = document.getElementById('out');
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function write(line){
  if (line === '__STATE__') { refresh(); return; }
  const cls = /失败|error|Error|不是|not found|拒绝/.test(line) ? 'e'
            : /装好了|就绪|完成|ok|OK/.test(line) ? 'ok'
            : /^\$|^\[/.test(line) ? 'i'
            : /^\s*…|已缓存|跳过/.test(line) ? 'd' : '';
  const atBottom = out.scrollTop + out.clientHeight >= out.scrollHeight - 40;
  const div = document.createElement('div');
  div.className = cls; div.innerHTML = esc(line);
  out.appendChild(div);
  if (atBottom) out.scrollTop = out.scrollHeight;
}
function refresh(){
  let s = {};
  try { s = JSON.parse(dsh.state()); } catch(e){}
  document.getElementById('path').textContent = s.root || '';
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (s.busy ? ' busy' : (s.installed ? ' on' : ''));
  document.getElementById('bHarness').disabled = !s.installed;
}
function run(cmd){
  if (!cmd || !cmd.trim()) return;
  write('$ ' + cmd);
  dsh.run(cmd);
}
document.getElementById('bInstall').onclick = () => { write('$ 安装运行环境'); dsh.install(); };
document.getElementById('bHarness').onclick = () => { write('$ 安装 DeepSeek Harness'); dsh.harness(); };
document.getElementById('bStop').onclick = () => dsh.stop();
document.getElementById('bClear').onclick = () => { out.innerHTML=''; };
document.getElementById('bRun').onclick = () => {
  const el = document.getElementById('cmd');
  run(el.value); el.value = '';
};
document.getElementById('cmd').addEventListener('keydown', e => {
  if (e.key === 'Enter') { document.getElementById('bRun').click(); }
});
document.querySelectorAll('.chips span').forEach(el => {
  el.onclick = () => run(el.dataset.cmd);
});
write('DSH 终端 · 在设备上跑 DeepSeek Harness');
write('首次使用：① 装环境（下载 Ubuntu rootfs + glibc Node）② 装 harness ③ 启动 dsh web');
refresh();
</script>
</body>
</html>
